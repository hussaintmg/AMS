# Keep uploaded files on the Node/API storage while serving them from the public app origin.
# ^~ is required so the vhost's generic .jpg/.png/.svg regex cannot intercept these URLs.
location ^~ /uploads/ {
    proxy_pass http://127.0.0.1:3002;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header Cache-Control "public, max-age=86400" always;
    access_log off;
}

location ^~ /api/uploads/ {
    proxy_pass http://127.0.0.1:3002;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header Cache-Control "public, max-age=86400" always;
    access_log off;
}

# Dealer Pro imports post several MB of workbooks and hold the connection open for
# minutes while rows commit. nginx's 60s proxy_read_timeout and 1M body limit would
# return 504/413 for an import the API is still running, so this location relaxes
# both. It must come before the generic /api/ location.
location ^~ /api/uploader/ {
    proxy_pass http://127.0.0.1:3002;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 64m;
    proxy_request_buffering off;
    proxy_connect_timeout 60s;
    proxy_send_timeout 30m;
    proxy_read_timeout 30m;
}

# Socket.IO live log updates must reach the API before SPA/static regex locations.
location ^~ /socket.io/ {
    proxy_pass http://127.0.0.1:3002/socket.io/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    access_log off;
}
